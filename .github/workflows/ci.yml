name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  # ইনস্টলার হাতে বানানোর জন্য — নিচের installer job দেখুন
  workflow_dispatch:

# একই ব্রাঞ্চে নতুন push এলে আগের রান বাতিল — অকারণে runner আটকে থাকে না
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server — lint · typecheck · test · build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: oxeio-monitor/server

    services:
      # লোকালে docker compose যেটা দেয়, CI-তে সেটাই service container হিসেবে।
      # টেস্ট নিজেই `oxeio_test` ডাটাবেস বানিয়ে নেয় (test/setup/global-setup.ts)
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oxeio
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: oxeio
          TZ: Asia/Dhaka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oxeio -d oxeio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # সার্ভারের TZ ঢাকাতেই রাখা জরুরি — মধ্যরাত-স্প্লিট ও work_date
      # এর উপরেই দাঁড়ানো (07-Technical-Spec § ২.১-ক)
      TZ: Asia/Dhaka
      DATABASE_URL: postgresql://oxeio:ci-password@localhost:5432/oxeio?schema=public
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: oxeio-monitor/server/package-lock.json

      - name: Install
        run: npm ci

      # npm 11-এর script-approval গেট থাকা সত্ত্বেও prisma-র engine নামা
      # নিশ্চিত করতে আলাদা করে generate চালানো হয়
      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # `npm test` স্থানীয়ভাবে ../.env পড়ে; CI-তে env উপরে দেওয়া আছে,
      # তাই vitest সরাসরি চালানো হয়
      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

  web:
    name: web — lint · build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: oxeio-monitor/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: oxeio-monitor/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` নিজেই `tsc -b` চালায়, তাই আলাদা typecheck ধাপ লাগে না
      - name: Build
        run: npm run build

  agent-core:
    name: agent core — build · test (linux)
    # ⚠️ পুরো solution নয়, শুধু Core আর তার টেস্ট।
    # oXeio.Agent টার্গেট করে net8.0-windows10.0.17763.0 — সেটা Linux-এ বিল্ডই হয় না।
    # নিয়মগুলো Core-এ রাখার পুরো লাভটা এখানেই: প্রতি PR-এ সস্তা runner-এ যাচাই হয়।
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: oxeio-monitor/agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build rules core
        run: dotnet build src/oXeio.Core/oXeio.Core.csproj -warnaserror

      - name: Test rules core
        run: dotnet test tests/oXeio.Core.Tests/oXeio.Core.Tests.csproj --verbosity normal

  agent-windows:
    name: agent full — build + test (windows)
    # Win32 স্তর শুধু Windows runner-এ বিল্ড হয়।
    #
    # ⚠️ এখানকার টেস্টগুলো **আসল ডেস্কটপ ছোঁয় না** — ক্যাপচার, tray বা DPAPI
    #    হেডলেস runner-এ যাচাই করা যায় না। যেগুলো চলে সেগুলো নকল store ও নকল
    #    সার্ভার দিয়ে সিঙ্ক লুপের সিদ্ধান্তগুলো পরীক্ষা করে — অর্থাৎ ঠিক সেই
    #    জায়গাটা যেখানে ভুল হলে ডেটা নীরবে মুছে যায়।
    runs-on: windows-latest

    defaults:
      run:
        working-directory: oxeio-monitor/agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build solution
        run: dotnet build -warnaserror

      - name: Test
        run: dotnet test -warnaserror --no-build

  installer:
    name: MSI — শুধু ট্যাগে বা হাতে চালালে
    # ⚠️ প্রতিটা push-এ চালানো হয় না। self-contained publish ~২০০ MB আর
    #    cab কম্প্রেশনে কয়েক মিনিট লাগে; রোজকার CI-তে ওটা নিছক অপচয়।
    #    রিলিজের আগে (ট্যাগ) বা হাতে চালিয়ে যাচাই করা হয়।
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    defaults:
      run:
        working-directory: oxeio-monitor/agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX
        run: dotnet tool install --global wix

      - name: Build MSI
        shell: pwsh
        run: ./installer/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: oXeioAgent-msi
          path: oxeio-monitor/agent/installer/bin/oXeioAgent.msi
          retention-days: 30

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4

      # Dockerfile ভাঙলে যেন রোলআউটের দিনে নয়, এখনই ধরা পড়ে
      - name: Build API image
        run: docker build -t oxeio-api:ci ./oxeio-monitor/server
