# ⭐⭐ VPS-এর জন্য override — বেস `docker-compose.yml`-এ হাত দিতে হয় না।
#
#   চালানো:
#       docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
#   ⚠️ প্রতিবার **দুটো `-f`-ই** দিতে হবে। একটা ভুলে গেলে compose বেস
#      ফাইলটাই ধরবে, অর্থাৎ Caddy আবার `:8080`-এ ফিরে যাবে আর ৪৪৩ বন্ধ
#      হয়ে যাবে — ⚠️ ১৫টা এজেন্ট তখন চুপচাপ কিউ জমাতে থাকবে।
#      ⭐ এড়াতে `.env`-এ লিখে রাখুন:
#          COMPOSE_FILE=docker-compose.yml:docker-compose.vps.yml
#      তাহলে খালি `docker compose up -d` দিলেই দুটোই ধরা হয়।
#
# ⚠️ এই ফাইলটা **কোনো গোপন মান রাখে না** — সব `.env` থেকে আসে।

services:
  web:
    environment:
      # ⭐ এই একটা মান বসানোর ফলেই Caddy আর `:8080`-এ নয়, ডোমেইনে শোনে,
      #    আর Let's Encrypt থেকে সার্ট নিয়ে নিজেই নবায়ন করে।
      #
      # ⚠️ `.env`-এ `PUBLIC_HOST=monitor.oxeio.com` বসান। এখানে হার্ডকোড
      #    করা হয়নি ইচ্ছাকৃতভাবে — ডোমেইন বদলালে একটা জায়গায় বদলাবে।
      CADDY_SITE: ${PUBLIC_HOST:?PUBLIC_HOST সেট নেই — .env-এ ডোমেইনটা বসান}
      TZ: Asia/Dhaka

    # ⚠️⚠️ ৮০ **আর** ৪৪৩, দুটোই লাগে।
    #
    #    ৪৪৩ আসল ট্রাফিকের জন্য, আর ৮০ Let's Encrypt-এর HTTP-01 যাচাইয়ের
    #    জন্য — ওটা বন্ধ থাকলে সার্ট ইস্যুই হবে না, আর Caddy লগে বারবার
    #    চেষ্টা করে ব্যর্থ হতে থাকবে। ⭐ Caddy ৮০-তে আসা বাকি সব ট্রাফিক
    #    নিজেই ৪৪৩-এ পাঠায়, তাই আলাদা কিছু করতে হয় না।
    #
    # ⚠️⚠️ `!override` — এটা **বাধ্যতামূলক**, বাদ দিলে নীরবে ভুল হয়।
    #    compose ডিফল্টে পোর্টের তালিকা **যোগ** করে, বদলায় না। তাই
    #    `!override` ছাড়া বেসের `8080:8080`-ও থেকে যেত, অথচ Caddy তখন
    #    ডোমেইন-মোডে ৮০/৪৪৩ ধরে — ৮০৮০-এ ভেতরে কিছুই শোনে না। ফল:
    #    VPS-এ একটা মৃত পোর্ট বাইরের জন্য খোলা, আর `docker compose ps`
    #    দেখে মনে হতো সব ঠিক আছে।
    ports: !override
      - '80:80'
      - '443:443'

    # ⚠️⚠️ **ঠিক উপরের ফাঁদটাই, এক স্তর গভীরে — আর প্রথমবার বাদ পড়েছিল।**
    #
    #    বেসের healthcheck ধাক্কা দেয় `127.0.0.1:8080`-এ, কিন্তু ডোমেইন-মোডে
    #    Caddy সেখানে শোনেই না (উপরে `netstat`: `:::80` ও `:::443`)। ফলে
    #    কনটেইনার **শুরু থেকে চিরকাল `unhealthy`** — ১৩ আগস্ট মেপে দেখা গেল
    #    `FailingStreak: 1077`, অথচ সাইট বাইরে থেকে দিব্যি ২০০ দিচ্ছিল।
    #
    # ⚠️ ক্ষতিটা "একটা লাল লেখা" নয়। `docker compose ps` তখন স্বাস্থ্যের
    #    সংকেত হিসেবে **অকেজো** হয়ে যায়, আর সবচেয়ে খারাপ: `depends_on`
    #    দিয়ে কেউ কোনোদিন `service_healthy` শর্ত বসালে সেটা কখনোই পূরণ হতো না।
    #
    # ⭐ চিরকাল-লাল একটা অ্যালার্ম মানুষকে অ্যালার্ম উপেক্ষা করতে শেখায় —
    #    সেটাই আসল বিপদ, কারণ পরের বার লালটা সত্যি হলেও কেউ তাকাবে না।
    #
    # ⚠️ `!override` **বাধ্যতামূলক** — `test` একটা তালিকা, আর compose তালিকা
    #    **যোগ** করে। ছাড়া দিলে কমান্ডটা হতো
    #    `wget … :8080/ CMD wget … :2019/` — অর্থহীন, আর তবু নীরবে ব্যর্থ।
    #
    # ⭐ Caddy-র admin API (`127.0.0.1:2019`, ডিফল্টেই চালু) বেছে নেওয়া হয়েছে:
    #    সে প্রমাণ করে প্রসেস জীবিত **ও কনফিগ লোড হয়েছে**, আর তার জন্য
    #    বাইরের DNS বা TLS কিছুই লাগে না।
    #    ⚠️ পোর্ট ৮০-তে ধাক্কা দেওয়া চলত না: ডোমেইন-মোডে সে ৩০১ দিয়ে
    #    HTTPS-এ পাঠায়, আর ইমেজের **BusyBox** wget-এ `--max-redirect` নেই,
    #    তাই সে ওটাকে ব্যর্থতা ধরে (মেপে দেখা: exit 1)।
    healthcheck: !override
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 5

    volumes:
      # ⚠️⚠️ **এটা বাদ দেওয়া যাবে না।** Caddy সার্ট ও অ্যাকাউন্টের কী
      #    রাখে `/data`-তে। volume না দিলে প্রতিবার কনটেইনার নতুন করে
      #    বানালে সার্ট হারিয়ে যায় আর Let's Encrypt-এর কাছে **আবার**
      #    চাওয়া হয় — আর ওদের হার-সীমা সপ্তাহে ৫টা। কয়েকবার রিস্টার্টেই
      #    সীমা পেরিয়ে গিয়ে এক সপ্তাহ সার্টহীন বসে থাকতে হতো।
      - caddy-data:/data
      - caddy-config:/config

  api:
    environment:
      # ⚠️ ড্যাশবোর্ড ও API একই origin (Caddy), তাই CORS আসলে লাগে না।
      #    তবু বসানো — অন্য কোনো ক্লায়েন্ট যোগ হলে এখান থেকেই শুরু।
      CORS_ORIGIN: https://${PUBLIC_HOST}

volumes:
  caddy-data:
  caddy-config:
