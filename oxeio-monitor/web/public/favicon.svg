<!--
  oXeio ব্র্যান্ড মার্ক — লাল টাইল, সাদা X। বাকি সব আইকন এই ফাইল থেকেই তৈরি।

  ⭐ **কেন শুধু X, পুরো "oX" নয়** — Brand.tsx-এর মার্কে "oX" আছে (o কালো,
     X লাল), কিন্তু ওটা টপবারে ২৮px-এ বসে। লঞ্চারে ৪৮px আর ট্যাবে ১৬px-এ
     দুটো অক্ষর মানে প্রতিটার উচ্চতা ৫-৬px — "o" তখন একটা দাগ, আর পুরো
     জিনিসটা চেনা যায় না। oXeio-র আলাদা করা অক্ষরটাই X (ওয়ার্ডমার্কে ওটাই
     লাল), তাই ছোট মাপে ওই একটাই রাখা হলো।

  ⭐ **রংটা উল্টানো — টাইল লাল, X সাদা** (Brand.tsx-এ টাইল সাদা, X লাল)।
     হোমস্ক্রিনে ৩০টা আইকনের ভিড়ে রংই সবচেয়ে দ্রুত চেনার সূত্র; সাদা টাইল
     ওয়ালপেপারের উপর মিলিয়ে যায়। ⚠️ কালো টাইল + সাদা X ইচ্ছাকৃতভাবে বাদ —
     ওটা হুবহু X (সাবেক Twitter) অ্যাপের আইকন।

  ⚠️ **অক্ষরটার মাথা-পা সমান্তরালে কাটা** (আনুভূমিক), ডাঁটির সাথে ৯০° কোণে
     নয়। "বন্ধ করুন"/ভুল চিহ্নের X-এ কাটা থাকে ডাঁটির লম্বে — এই একটা
     পার্থক্যই মার্কটাকে বোতাম নয়, **অক্ষর** বলে চেনায়।

  ⚠️ **লেখাটা <text> নয়, হাতে আঁকা path** — <text> হলে ফন্ট নির্ভর করত
     ডিভাইসের উপর, আর প্রতিটা ফোনে আইকনের চেহারা আলাদা হতো।
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="oXeio">
  <!-- টাইল কোণা পর্যন্ত ভরাট — মাঝে কোনো স্বচ্ছতা নেই -->
  <rect width="512" height="512" rx="112" fill="#ed1c24"/>
  <!-- X: দুটো সমান পুরুত্বের ডাঁটি, ৩০৮×৩০৮ বাক্সে (টাইলের ৬০%)।
       ডাঁটির লম্ব-পুরুত্ব ৬৬.৫ = টাইলের ১৩%, অর্থাৎ ১৬px favicon-এ ২px —
       এর চেয়ে সরু করলে ট্যাবে ডাঁটিটা ধূসর হয়ে মিলিয়ে যেত। -->
  <path fill="#fff" d="M102 102h94L410 410h-94z"/>
  <path fill="#fff" d="M316 102h94L196 410H102z"/>
</svg>
