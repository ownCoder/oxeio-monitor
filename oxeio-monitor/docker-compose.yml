name: oxeio

services:
  postgres:
    image: postgres:16-alpine
    container_name: oxeio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oxeio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-oxeio}
      TZ: Asia/Dhaka # GMT+6 (UTC+06:00), no DST
    # bound to loopback only — the database is never reachable from the LAN
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oxeio} -d ${POSTGRES_DB:-oxeio}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: oxeio-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Asia/Dhaka # GMT+6 (UTC+06:00), no DST
      DATABASE_URL: postgresql://${POSTGRES_USER:-oxeio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-oxeio}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PORT: 3000
      STORAGE_ROOT: /data/storage
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}

      # ── K02/K03/G39 · রাতের ব্যাকআপ ────────────────────────────────────
      # ⚠️ BACKUP_PASSPHRASE না দিলে ব্যাকআপ **চলবেই না** — ইচ্ছাকৃত।
      #    এনক্রিপশন ছাড়া বেতন ও স্ক্রিনশটের ডাটাবেস ডিস্কে ফেলে রাখার
      #    চেয়ে ব্যাকআপ বন্ধ থাকা নিরাপদ। বুটে logger.error, আর রোজ
      #    একটা G04 অ্যালার্ট — নীরবে বন্ধ থাকে না।
      # ⚠️ `:?` দিয়ে বাধ্যতামূলক করা হয়নি, কারণ তাতে ডেভ মেশিনে
      #    কনটেইনারই উঠত না।
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      # Postgres এই compose-এ কনটেইনারে, হোস্টে pg_dump নাও থাকতে পারে —
      # তাই ডাম্প কন্টেইনারের ভেতর থেকেই নেওয়া হয়।
      BACKUP_DOCKER_CONTAINER: ${BACKUP_DOCKER_CONTAINER:-}
      BACKUP_COPY_TO: ${BACKUP_COPY_TO:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}

      # ── F06/F07 · রিপোর্ট ও ডাইজেস্ট ───────────────────────────────────
      ORG_NAME: ${ORG_NAME:-oXeio Monitoring}
      # খালি হলে সক্রিয় owner-দের ইমেইলে যায় (ALERT_EMAIL_TO-তে নয়)
      DIGEST_EMAIL_TO: ${DIGEST_EMAIL_TO:-}

      # ── G08 · টেলিগ্রাম অ্যালার্ট (দুটোই না থাকলে চুপচাপ বন্ধ) ──────────
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

      # ── I01 · HTTPS/TLS ────────────────────────────────────────────────
      # ⚠️ চালু করতে তিনটে জিনিস **একসাথে** লাগে, নইলে কিছুই কাজ করবে না:
      #    ১· নিচের দুটো লাইন খোলা  ২· ports → "443:3000"
      #    ৩· volumes-এ ./deploy/certs:/certs:ro
      #    আর CORS_ORIGIN https:// দিয়ে শুরু হতে হবে।
      # ⭐ একটা দিয়ে আরেকটা না দিলে সার্ভার **উঠবেই না** — নীরবে HTTP-তে
      #    নেমে গেলে একটা টাইপো এজেন্টের ডিভাইস টোকেন মাসের পর মাস
      #    প্লেইনটেক্সটে LAN-এ পাঠাত, আর বাইরে থেকে সব ঠিক দেখাত।
      # সার্ট বানানো: deploy/make-cert.ps1 (বিস্তারিত deploy/README.md § ৬)
      # TLS_CERT: /certs/oxeio-cert.pem
      # TLS_KEY: /certs/oxeio-key.pem
    ports:
      - "3000:3000"
    volumes:
      - ${STORAGE_HOST_PATH:-./.data/storage}:/data/storage
      # TLS চালু করলে:
      # - ./deploy/certs:/certs:ro
      # ⚠️ BACKUP_DOCKER_CONTAINER ব্যবহার করলে api কনটেইনারকে হোস্টের
      #    docker daemon-এ পৌঁছাতে হবে (নিচের সকেটটা খুলতে হবে)।
      #    ⚠️ এটা কার্যত হোস্টে root-সমান ক্ষমতা — শুধু তখনই খুলুন যখন
      #    বিকল্প নেই। বিকল্প আছে: হোস্টে postgresql-client বসিয়ে
      #    BACKUP_PG_DUMP ব্যবহার করা, অথবা ব্যাকআপ হোস্ট থেকে চালানো।
      # - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
