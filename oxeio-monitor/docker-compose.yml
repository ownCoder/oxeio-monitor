name: oxeio

services:
  postgres:
    image: postgres:16-alpine
    container_name: oxeio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oxeio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-oxeio}
      TZ: Asia/Dhaka # GMT+6 (UTC+06:00), no DST
    # bound to loopback only — the database is never reachable from the LAN
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oxeio} -d ${POSTGRES_DB:-oxeio}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      # ⭐ ওয়েবের সাথে **একই** ভার্সন — `/health` এটা ফেরত দেয়, আর
      #    ড্যাশবোর্ড দুটো মিলিয়ে দেখে (অর্ধেক ডিপ্লয় ধরার একমাত্র উপায়)।
      args:
        APP_BUILD: ${APP_BUILD:-}
        APP_COMMIT: ${APP_COMMIT:-}
    container_name: oxeio-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Asia/Dhaka # GMT+6 (UTC+06:00), no DST
      DATABASE_URL: postgresql://${POSTGRES_USER:-oxeio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-oxeio}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # ⚠️ চলক দুটো এখানে **স্পষ্ট করে** পাস করতে হয়। compose হোস্টের
      #    পরিবেশ কনটেইনারে নিজে থেকে নেয় না, তাই লাইন দুটো না থাকলে
      #    `.env`-এ যা-ই লেখা হোক সার্ভার ডিফল্টই ব্যবহার করত — আর
      #    "সেটিং কাজ করছে না" বোঝার কোনো উপায় থাকত না।
      LOGIN_MAX_FAILS: ${LOGIN_MAX_FAILS:-10}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-2}
      PORT: 3000
      STORAGE_ROOT: /data/storage
      # ⚠️ ড্যাশবোর্ড `web` সার্ভিস দিয়ে চললে এটা কার্যত অব্যবহৃত — Caddy
      #    API ও পাতা **একই origin**-এ দেয়, তাই ব্রাউজার cross-origin
      #    রিকোয়েস্টই করে না (web/Caddyfile দেখুন)।
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}

      # ⚠️ না দিলে JWT_SECRET থেকেই আলাদা চাবি বানানো হয় (label মিশিয়ে),
      #    তাই খালি রাখা নিরাপদ। আলাদা দিলে স্ক্রিনশটের লিঙ্ক আর সেশন
      #    সম্পূর্ণ আলাদা চাবিতে চলে।
      SCREENSHOT_URL_SECRET: ${SCREENSHOT_URL_SECRET:-}

      # ── G05/G07 · ইমেইল ────────────────────────────────────────────────
      # ⚠️⚠️ **এই ছ-টা লাইন আগে এখানে ছিল না** — ফলে ডকের ধাপ মেনে চললে
      #    সার্ভার উঠত ইমেইল সম্পূর্ণ বন্ধ অবস্থায়। অ্যালার্ট তৈরি হতো,
      #    ডাটাবেসে বসত, কিন্তু কারো কাছে **পৌঁছাত না** — আর সেটা কোথাও
      #    ভুল হিসেবেও দেখাত না, কারণ "SMTP নেই" মানে চ্যানেল চুপচাপ বন্ধ।
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # খালি হলে সক্রিয় owner-দের ইমেইলে যায়
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}

      # ── K02/K03/G39 · রাতের ব্যাকআপ ────────────────────────────────────
      # ⚠️ BACKUP_PASSPHRASE না দিলে ব্যাকআপ **চলবেই না** — ইচ্ছাকৃত।
      #    এনক্রিপশন ছাড়া বেতন ও স্ক্রিনশটের ডাটাবেস ডিস্কে ফেলে রাখার
      #    চেয়ে ব্যাকআপ বন্ধ থাকা নিরাপদ। বুটে logger.error, আর রোজ
      #    একটা G04 অ্যালার্ট — নীরবে বন্ধ থাকে না।
      # ⚠️ `:?` দিয়ে বাধ্যতামূলক করা হয়নি, কারণ তাতে ডেভ মেশিনে
      #    কনটেইনারই উঠত না।
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      # Postgres এই compose-এ কনটেইনারে, হোস্টে pg_dump নাও থাকতে পারে —
      # তাই ডাম্প কন্টেইনারের ভেতর থেকেই নেওয়া হয়।
      BACKUP_DOCKER_CONTAINER: ${BACKUP_DOCKER_CONTAINER:-}
      BACKUP_COPY_TO: ${BACKUP_COPY_TO:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      # বাকি চারটেও পাস করা হয় — নইলে .env-এ বসিয়ে কেউ ভাবতেন কাজ হচ্ছে
      BACKUP_DIR: ${BACKUP_DIR:-}
      BACKUP_PG_DUMP: ${BACKUP_PG_DUMP:-}
      BACKUP_DOCKER_BIN: ${BACKUP_DOCKER_BIN:-}
      BACKUP_DOCKER_DB_HOST: ${BACKUP_DOCKER_DB_HOST:-}

      # ── F06/F07 · রিপোর্ট ও ডাইজেস্ট ───────────────────────────────────
      ORG_NAME: ${ORG_NAME:-oXeio Monitoring}
      # খালি হলে সক্রিয় owner-দের ইমেইলে যায় (ALERT_EMAIL_TO-তে নয়)
      DIGEST_EMAIL_TO: ${DIGEST_EMAIL_TO:-}

      # ── G08 · টেলিগ্রাম অ্যালার্ট (দুটোই না থাকলে চুপচাপ বন্ধ) ──────────
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

      # ── I01 · HTTPS/TLS ────────────────────────────────────────────────
      # ⚠️ চালু করতে তিনটে জিনিস **একসাথে** লাগে, নইলে কিছুই কাজ করবে না:
      #    ১· নিচের দুটো লাইন খোলা  ২· ports → "443:3000"
      #    ৩· volumes-এ ./deploy/certs:/certs:ro
      #    আর CORS_ORIGIN https:// দিয়ে শুরু হতে হবে।
      # ⭐ একটা দিয়ে আরেকটা না দিলে সার্ভার **উঠবেই না** — নীরবে HTTP-তে
      #    নেমে গেলে একটা টাইপো এজেন্টের ডিভাইস টোকেন মাসের পর মাস
      #    প্লেইনটেক্সটে LAN-এ পাঠাত, আর বাইরে থেকে সব ঠিক দেখাত।
      # সার্ট বানানো: deploy/make-cert.ps1 (বিস্তারিত deploy/README.md § ৬)
      # TLS_CERT: /certs/oxeio-cert.pem
      # TLS_KEY: /certs/oxeio-key.pem
    # ⚠️⚠️ **`127.0.0.1:` অংশটা সরাবেন না।**
    #
    #    এটা ছাড়া `3000:3000` মানে API **পৃথিবীর সবার জন্য খোলা** — VPS-এ
    #    সেটা Caddy-কে (আর তার TLS-কে) পুরোপুরি পাশ কাটিয়ে যায়, অর্থাৎ
    #    ডিভাইস টোকেন ও স্ক্রিনশট প্লেইন HTTP-তে ইন্টারনেটে চলে যেত।
    #    ⚠️ আর ফাঁদটা নীরব: ব্রাউজারে সব ঠিকই দেখাত, কারণ ড্যাশবোর্ড
    #    Caddy দিয়েই যায়।
    #
    # ⭐ Caddy api-তে পৌঁছায় **docker নেটওয়ার্কের ভেতর দিয়ে** (`api:3000`),
    #    প্রকাশিত পোর্ট দিয়ে নয় — তাই এতে কিছুই ভাঙে না। পোর্টটা রাখা
    #    হয়েছে শুধু হোস্ট থেকে সরাসরি দেখার জন্য (curl, ডিবাগ)।
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ${STORAGE_HOST_PATH:-./.data/storage}:/data/storage
      # TLS চালু করলে:
      # - ./deploy/certs:/certs:ro
      # ⚠️ BACKUP_DOCKER_CONTAINER ব্যবহার করলে api কনটেইনারকে হোস্টের
      #    docker daemon-এ পৌঁছাতে হবে (নিচের সকেটটা খুলতে হবে)।
      #    ⚠️ এটা কার্যত হোস্টে root-সমান ক্ষমতা — শুধু তখনই খুলুন যখন
      #    বিকল্প নেই। বিকল্প আছে: হোস্টে postgresql-client বসিয়ে
      #    BACKUP_PG_DUMP ব্যবহার করা, অথবা ব্যাকআপ হোস্ট থেকে চালানো।
      # - /var/run/docker.sock:/var/run/docker.sock

    # ⚠️ রানবুক বলে "দুটোই healthy হওয়া চাই", অথচ এখানে কোনো healthcheck
    #    ছিল না — `docker compose ps` শুধু "running" দেখাত, আর ভেতরে অ্যাপ
    #    ক্র্যাশ-লুপে থাকলেও সেটা running-ই।
    # ⚠️ scheme TLS_CERT দেখে বাছা হয় (সার্ভার TLS পেলে ওই পোর্টে আর প্লেইন
    #    HTTP থাকে না)। self-signed সার্ট বলে যাচাই বাদ — কলটা loopback-এ,
    #    কনটেইনারের ভেতর থেকে নিজের কাছেই।
    healthcheck:
      test:
        - CMD
        - node
        - -e
        # ⚠️ টেমপ্লেট লিটারেল (`${...}`) ব্যবহার করা যাবে না — docker compose
        #    নিজেই ওটাকে তার চলক ভেবে বসে আর ফাইলটাই অবৈধ হয়ে যায়।
        - |
          const s = process.env.TLS_CERT ? 'https' : 'http';
          const p = process.env.PORT || 3000;
          process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0';
          fetch(s + '://127.0.0.1:' + p + '/api/v1/health')
            .then(r => r.json())
            .then(j => process.exit(j.db === 'up' ? 0 : 1))
            .catch(() => process.exit(1));
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── ড্যাশবোর্ড ──────────────────────────────────────────────────────────
  # ⭐ এটাই সেই সার্ভিস যেটা এতদিন ছিল না। ওয়েব ও API একই origin-এ
  #    (web/Caddyfile), তাই cookie ও CORS দুটো সমস্যাই আর নেই।
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      # ⭐ `deploy/vps-update.sh` git থেকে ভরে দেয়। খালি থাকলে ইমেজের
      #    ডিফল্ট (`dev`/`local`) বসে — বিল্ড থামে না, শুধু সৎ থাকে।
      args:
        APP_BUILD: ${APP_BUILD:-}
        APP_COMMIT: ${APP_COMMIT:-}
        APP_BUILT_AT: ${APP_BUILT_AT:-}
    container_name: oxeio-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: Asia/Dhaka
    # ⚠️ VPS-এ `WEB_PORT` কাজে লাগে না — ওখানে Caddy নিজেই ৮০ ও ৪৪৩ ধরে
    #    (Let's Encrypt-এর যাচাই ৮০-তে হয়)। তখন এই দুটো লাইন হবে:
    #        - "80:80"
    #        - "443:443"
    #    আর `web/Caddyfile`-এ `:8080`-এর বদলে ডোমেইনটা বসবে।
    #    বিস্তারিত deploy/README § ৩।
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ── একবারের কাজ: স্কিমা ও seed ─────────────────────────────────────────
  # ⚠️⚠️ **এটা ছাড়া `docker compose up -d` করলে ডাটাবেসে একটাও টেবিল বসে না।**
  #    রানবুকে ধাপটাই ছিল না, আর api-র runtime ইমেজে prisma CLI বা tsx
  #    নেই (Dockerfile § runtime), তাই কনটেইনার নিজে চালাতেও পারত না।
  #
  # ⭐ `target: build` — ওই স্তরে সোর্স ও পূর্ণ node_modules দুটোই আছে।
  # ⭐ profile দেওয়া, তাই `up -d`-তে চলে না। ইচ্ছাকৃত: মাইগ্রেশন হলো
  #    সচেতন একটা ধাপ, প্রতিবার রিস্টার্টে নিজে থেকে চলার জিনিস নয়।
  #
  #     docker compose --profile setup run --rm migrate
  #
  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: build
    profiles: ["setup"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Dhaka
      DATABASE_URL: postgresql://${POSTGRES_USER:-oxeio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-oxeio}?schema=public
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
      SEED_OWNER_NAME: ${SEED_OWNER_NAME:-}
    volumes:
      # ⚠️ prisma/ হোস্ট থেকে mount করা হয়, ইমেজে বেক করা নয় — কারণ
      #    `staff.local.json`-এ কর্মীদের **নাম ও বেতন** থাকে। ইমেজে ঢুকলে
      #    সেটা প্রতিটা লেয়ার-কপির সাথে ছড়াত ([09 § ৩ঊ](../docs/09-Build-Log.md))।
      - ./server/prisma:/app/prisma:ro
    # ⚠️ `npm run seed` নয় — ওটা `dotenv -e ../.env` দিয়ে মোড়া, আর
    #    কনটেইনারে ওই ফাইল নেই। চলক compose থেকেই আসছে।
    command: >
      sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"

volumes:
  pgdata:
