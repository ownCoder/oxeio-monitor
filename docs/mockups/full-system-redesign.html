<body>
<div class="app">
 <aside class="sidebar" id="sidebar"><div class="brand"><span class="brandmark">×</span><span>oXeio<small>office hub</small></span></div><nav class="nav-scroll" id="nav" aria-label="Main navigation"></nav><div class="sidebar-foot"><label for="role">Preview role</label><select id="role" class="field"><option value="owner">Owner</option><option value="manager">Manager</option><option value="designer">Designer</option><option value="researcher">Researcher</option></select><p class="role-hint">Switch roles to preview each workspace.</p></div></aside>
 <div class="workspace"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="top-button mobile-menu" id="menu" type="button" aria-label="Open navigation">☰</button><div class="breadcrumb">Workspace / <strong id="crumb">Live Board</strong></div></div><div class="top-actions"><button class="top-button search-top" data-action="search" type="button">⌕ &nbsp; Search</button><button class="top-button inbox-top" data-action="inbox" type="button">Inbox <span class="warn">3</span></button><span class="time">Dhaka · 8 Oct 2026</span><span class="avatar">OX</span></div></header><main class="content" id="page"></main></div>
</div>
<div id="modal-root"></div>
<script>
const navGroups=[
 {label:'Workspace',items:[['live','▦','Live Board'],['worklog','◷','Worklog']]},
 {label:'Targets',items:[['add','⊕','Add target design'],['pool','▤','Design Pool'],['daily','▥','Daily designs & skips'],['review','✓','Review']]},
 {label:'Team',items:[['mydata','◎','My data'],['staff','♙','Staff'],['screenshots','▧','Screenshots'],['monthly','▦','Monthly'],['reports','◫','Reports'],['salary','৳','Salary'],['deposits','◇','Deposits']]},
 {label:'Oversight',items:[['alerts','△','Alerts'],['security','⛨','Security'],['settings','⚙','Settings']]},
 {label:'Operations',items:[['office','⌂','Office'],['production','◈','Production']]}
];
const rolePages={owner:['live','worklog','add','pool','daily','review','staff','screenshots','monthly','reports','salary','deposits','alerts','security','settings','office','production'],manager:['live','worklog','add','pool','daily','review','staff','screenshots','monthly','reports','settings','office','production'],designer:['mydata'],researcher:['add','pool']};
const staff=[['OX-01','Designer A','Working','7h 12m','23 / 25'],['OX-02','Designer B','Working','6h 48m','20 / 25'],['OX-03','Designer C','Idle','5h 41m','18 / 25'],['OX-04','Designer D','Offline','0h','0 / 25']];
let active='live',role='owner',sectionTab='overview',searchText='';
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pill=(v,t='gray')=>'<span class="pill '+t+'">'+esc(v)+'</span>';
const metric=(label,value,note,tone='')=>'<article class="panel metric"><div class="metric-label">'+label+'</div><div class="metric-value '+tone+'">'+value+'</div><div class="metric-note">'+note+'</div></article>';
const person=(code,name)=>'<span class="person"><span class="person-icon">'+esc(name.split(' ').map(x=>x[0]).slice(0,2).join(''))+'</span><span><strong>'+esc(name)+'</strong><small>'+esc(code)+'</small></span></span>';
const head=(eyebrow,title,subtitle,actions='')=>'<header class="page-head"><div><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1><p>'+subtitle+'</p></div><div class="head-actions"><span class="sample">Illustrative data · layout mockup</span>'+actions+'</div></header>';
const box=(title,subtitle,content)=>'<section class="panel panel-pad"><div class="section-head"><h2>'+title+'</h2><span>'+subtitle+'</span></div>'+content+'</section>';
const rows=(headers,body)=>'<section class="panel table-panel"><div class="table-title"><h2>'+headers[0]+'</h2><span>'+headers[1]+'</span></div><div class="table-scroll"><table><thead><tr>'+headers.slice(2).map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+body+'</tbody></table></div><div class="table-foot"><span>Sample records for layout review</span><span>Asia/Dhaka</span></div></section>';
const row=cells=>'<tr>'+cells.map(c=>'<td>'+c+'</td>').join('')+'</tr>';
const list=items=>'<div class="list">'+items.map(x=>'<div class="list-item"><div><strong>'+x[0]+'</strong><small>'+x[1]+'</small></div><div class="right">'+x[2]+'</div></div>').join('')+'</div>';
const filters=(extra='')=>'<div class="panel toolbar"><label>Period<select class="field"><option>Today</option><option>Last 7 days</option><option>This month</option></select></label><label>Staff<select class="field"><option>All staff</option><option>Designer A</option><option>Designer B</option></select></label>'+extra+'<span class="push"></span><button class="btn" data-action="refresh">↻ &nbsp; Refresh</button></div>';
const chart=(a,b,labels=['Fri','Sat','Sun','Mon','Tue','Wed','Thu'],ca='green',cb='amber')=>'<div class="bars">'+labels.map((l,i)=>'<div class="bar-day"><div class="bar-pair"><i class="bar '+ca+'" style="height:'+a[i]+'%"></i><i class="bar '+cb+'" style="height:'+b[i]+'%"></i></div><small>'+l+'</small></div>').join('')+'</div><div class="legend"><span><i style="background:var(--'+ca+')"></i>'+ (ca==='green'?'Completed':'Hours')+'</span><span><i style="background:var(--'+cb+')"></i>'+ (cb==='amber'?'Skipped':'Target')+'</span></div>';
function nav(){let h='';navGroups.forEach(g=>{const visible=g.items.filter(i=>rolePages[role].includes(i[0]));if(!visible.length)return;h+='<div class="nav-group"><div class="nav-label">'+g.label+'</div>'+visible.map(i=>'<button type="button" class="nav-item '+(active===i[0]?'active':'')+'" data-page="'+i[0]+'"><span class="nav-icon">'+i[1]+'</span>'+i[2]+(i[0]==='alerts'?'<span class="nav-badge">3</span>':'')+'</button>').join('')+'</div>';});$('#nav').innerHTML=h;$('#crumb').textContent=navGroups.flatMap(g=>g.items).find(i=>i[0]===active)?.[2]||'Live Board';}
function live(){return head('Workspace overview','Live Board','A clear view of team presence, output and work that needs attention.','<button class="btn" data-page="worklog">Open Worklog ↗</button>')+'<div class="stack"><div class="grid g4">'+metric('Working now','10 / 11','Live agent connections','good')+metric('Hours today','67h 32m','Across 10 staff','blue')+metric('Designs finished','176','Today so far','good')+metric('Open alerts','3','1 needs review','warn')+'</div><div class="two-col">'+box('Team output','Last 7 days',chart([44,67,74,82,77,88,94],[8,9,10,10,10,10,10],undefined,'green','blue'))+box('Needs attention','Prioritized',list([['1 agent offline','Check connection or device',''+pill('Urgent','red')],['3 skip reviews','Event / Copyright / Others',pill('Review','amber')],['2 help requests','Waiting for manager response',pill('Office','blue')]]))+'</div>'+rows(['Team snapshot','Current status','Staff','Status','Today','Designs','Progress'],staff.map(s=>row([person(s[0],s[1]),pill(s[2],s[2]==='Working'?'green':s[2]==='Idle'?'amber':'red'),s[3],s[4],'<div class="progress"><i style="width:'+(s[2]==='Offline'?0:Math.round(parseInt(s[4])/25*100))+'%"></i></div>'])).join(''))+'</div>';}
function worklog(){return head('Work history','Worklog','See sessions, work time and activity by staff and day.','<button class="btn" data-action="export">Export CSV</button>')+filters()+'<div class="stack"><div class="grid g4">'+metric('Tracked time','28h 14m','Selected day','blue')+metric('Active sessions','8','Currently online','good')+metric('Idle time','1h 06m','Across the team','warn')+metric('Unreviewed gaps','2','Need context','danger-text')+'</div><div class="two-col">'+rows(['Staff worklog','8 Oct 2026','Staff','First seen','Tracked','Idle','Status'],staff.map((s,i)=>row([person(s[0],s[1]),['08:03','08:17','08:31','—'][i],s[3],['12m','18m','36m','—'][i],pill(s[2],s[2]==='Working'?'green':'amber')])).join(''))+box('Today’s timeline','Sample events','<div class="timeline">'+[['09:42','Designer B resumed work','Active design session'],['09:18','Designer C became idle','No input for the configured interval'],['08:31','Designer C signed in','Agent connection restored'],['08:03','Designer A started tracking','First recorded session today']].map(e=>'<div class="event"><span class="event-time">'+e[0]+'</span><i class="event-dot"></i><div><strong>'+e[1]+'</strong><p>'+e[2]+'</p></div></div>').join('')+'</div>')+'</div></div>';}
function add(){return head('Targets pipeline','Add target design','Collect Amazon links and move clean targets into the Design Pool.','')+'<div class="stack">'+box('The Pipeline','From collected link to finished design','<div class="steps"><div class="step"><small>In the pool</small><strong>14,062</strong></div><div class="step active"><small>In hand</small><strong>200</strong></div><div class="step"><small>Designed</small><strong>37,124</strong></div></div><p class="small">Dropped along the way: 794 skipped · 24 gone from Amazon</p>')+'<div class="form-layout">'+box('Add links','One per line — paste as many as you like','<div class="note">Amazon /dp/, /gp/product/, .co.uk links or a bare ASIN are accepted. Duplicates are removed.</div><div class="form-line"><label for="links">Amazon links</label><textarea class="field" id="links" placeholder="https://www.amazon.com/dp/B0..."></textarea></div><button class="btn primary" data-action="add-links">Add to pool</button><p class="small">Distribution runs automatically at 8:00 every morning.</p>')+box('Before links enter the pool','Automatic checks',list([['Valid Amazon URL or ASIN','Normalize link formats',pill('Ready','green')],['Duplicate detection','Existing targets are skipped',pill('Automatic','blue')],['Page health','Manager can mark Not Found',pill('Review','amber')]]))+'</div></div>';}
function pool(){return head('Targets','Design Pool','Find, review and manage the full target inventory.','<button class="btn" data-page="add">+ Add links</button>')+'<div class="stack"><div class="grid g4">'+metric('Ready pool','14,062','Available for distribution','blue')+metric('In hand','200','Assigned to designers','good')+metric('Designed','37,124','Finished targets','good')+metric('Deleted · Not Found','24','Confirmed unavailable','warn')+'</div>'+filters('<label>Status<select class="field"><option>Every target</option><option>Ready</option><option>Assigned</option><option>Designed</option><option>Deleted</option></select></label><label>Search<input class="field" placeholder="ASIN, job or designer"></label>')+rows(['Every target','Showing recent records','ASIN / Job','Status','Assigned to','Added','Actions'],[['B0D3E5A901','Ready','—','8 Oct'],['B0C7F2K118','In hand','Designer A','8 Oct'],['B0B5T4R606','Designed','Designer B','7 Oct'],['B0A9N2Q443','Ready','—','7 Oct']].map(x=>row(['<span class="num">'+x[0]+'</span><small style="display:block;color:var(--subtle)">Job #'+(Math.floor(Math.random()*1000)+3200)+'</small>',pill(x[1],x[1]==='Designed'?'green':x[1]==='Ready'?'blue':'amber'),x[2],x[3],'<button class="btn ghost" data-action="details">Details</button>'])).join(''))+'</div>';}
function daily(){return head('Production insights','Daily designs & skips','See output, skip reasons and replacement status for each designer.','')+'<div class="stack">'+filters('<label>From<input type="date" class="field" value="2026-10-02"></label><label>To<input type="date" class="field" value="2026-10-08"></label>')+'<div class="grid g6">'+metric('Issued','184','Assignments in period')+metric('Completed','161','Finished designs','good')+metric('Recorded skips','14','With selected reasons','warn')+metric('Pending','9','Still assigned')+metric('Replacement issued','13','1:1 delivered','blue')+metric('Replacement owed','1','Needs allocation','danger-text')+'</div><div class="two-col">'+box('Output this week','Completed vs recorded skips',chart([52,68,74,82,91,78,96],[8,14,7,17,10,12,10]))+box('Needs attention','Selected period',list([['Skip reviews waiting','Event, Copyright or Others',pill('3','amber')],['Replacement still owed','Check available pool stock',pill('1','blue')]]))+'</div>'+rows(['Designer activity','Click a row to see reasons','Date','Designer','Issued','Completed','Skipped','Pending','Replacement','Details'],[['Designer A','OX-01','47','41','4','2','4 issued'],['Designer B','OX-02','45','40','3','2','3 issued'],['Designer C','OX-03','48','42','4','2','3 / 4 issued'],['Designer D','OX-04','44','38','3','3','3 issued']].map(x=>row(['8 Oct 2026',person(x[1],x[0]),x[2],'<span class="num good">'+x[3]+'</span>','<span class="num warn">'+x[4]+'</span>',x[5],pill(x[6],x[6].includes('/')?'amber':'green'),'<button class="btn ghost" data-action="reasons">Show ▾</button>'])).join(''))+'</div>';}
function review(){return head('Quality control','Review','Approve or reject skipped designs that need a manager decision.','')+'<div class="stack"><div class="grid g4">'+metric('Waiting review','3','Event, Copyright or Others','warn')+metric('Approved today','5','Manager decisions','good')+metric('Rejected today','1','Returned for correction','danger-text')+metric('Page Not Found','8','Automatically accepted','blue')+'</div>'+filters('<label>Reason<select class="field"><option>All reasons</option><option>Event</option><option>Copyright</option><option>Others</option></select></label>')+rows(['Review queue','Newest first','Design','Designer','Reason','Submitted','Replacement','Decision'],[['B0C7F2K118','Designer A','Copyright','09:12','Issued'],['B0F8L6P225','Designer C','Event','08:58','Issued'],['B0D4H9N332','Designer B','Others','08:42','Owed']].map(x=>row(['<span class="num">'+x[0]+'</span>',x[1],pill(x[2],'amber'),x[3],pill(x[4],x[4]==='Issued'?'green':'red'),'<button class="btn" data-action="review-item">Review</button>'])).join(''))+'<div class="note"><strong>Review rule</strong><p>Page Not Found needs no manager review. Event, Copyright and Others enter this queue after the skip; 1:1 replacement is tracked separately.</p></div></div>';}
function mydata(){return head('Designer workspace','My data','Your assigned designs, progress and activity in one focused view.','')+'<div class="stack"><div class="grid g4">'+metric('Today’s target','25','Designs','blue')+metric('Completed','18','Today','good')+metric('In hand','7','Open designs','blue')+metric('Skipped','2','Replacement tracked','warn')+'</div><div class="two-col">'+rows(['My designs','Select a design to keep it highlighted','Job / ASIN','Status','Assigned','Link'],[['#3488 · B0C7F2K118','In progress','Today'],['#3489 · B0D3E5A901','Ready','Today'],['#3490 · B0F8L6P225','Ready','Today']].map((x,i)=>row(['<button class="btn ghost" data-action="select-design">'+x[0]+'</button>',pill(x[1],i?'blue':'amber'),x[2],'<button class="btn ghost" data-action="open-link">Open ↗</button>'])).join(''))+box('Today’s pace','18 of 25 complete','<div class="metric-value good">72%</div><div class="progress" style="margin:10px 0 18px"><i style="width:72%"></i></div>'+list([['Next milestone','7 designs remaining',pill('On track','green')],['Skip a design','Choose a reason first',pill('1:1 replacement','blue')]]))+'</div></div>';}
function staffView(){return head('Team directory','Staff','Staff profiles, roles and access in one searchable roster.','<button class="btn primary" data-action="new-staff">+ Add staff</button>')+filters('<label>Role<select class="field"><option>All roles</option><option>Designer</option><option>Manager</option><option>Researcher</option></select></label><label>Search<input class="field" placeholder="Name or staff code"></label>')+rows(['People','11 active staff','Staff','Role','Agent','Today','Actions'],staff.map((s,i)=>row([person(s[0],s[1]),pill(i===3?'Manager':'Designer','blue'),pill(s[2],s[2]==='Working'?'green':s[2]==='Idle'?'amber':'red'),s[3],'<button class="btn ghost" data-action="profile">View profile</button>'])).join(''));}
function screenshots(){return head('Visual audit','Screenshots','Review captured work with filters that narrow the gallery quickly.','')+filters('<label>Date<input type="date" class="field" value="2026-10-08"></label><label>App<select class="field"><option>All apps</option><option>Chrome</option><option>Illustrator</option><option>Photoshop</option></select></label><label>Time<select class="field"><option>Any time</option><option>Morning</option><option>Afternoon</option></select></label>')+'<div class="panel panel-pad"><div class="section-head"><h2>Capture gallery</h2><span>Illustrative placeholders — no actual employee screens</span></div><div class="shot-grid">'+['Designer A','Designer B','Designer C','Designer A','Designer D','Designer B','Designer C','Designer D'].map((name,i)=>'<article class="shot"><div class="shot-visual"><i></i><i></i><i></i></div><div class="shot-meta"><b>'+name+'</b><small>8 Oct · '+(9+Math.floor(i/4))+':'+String(i*7%60).padStart(2,'0')+' · '+['Chrome','Illustrator','Photoshop'][i%3]+'</small></div></article>').join('')+'</div></div>';}
function monthly(){return head('Monthly trends','Monthly','Track attendance, time and design pace across the month.','<button class="btn" data-action="export">Export month</button>')+'<div class="stack">'+filters('<label>Month<input type="month" class="field" value="2026-10"></label>')+'<div class="grid g4">'+metric('Hours counted','469h','Team this month','blue')+metric('Designs finished','1,204','Month to date','good')+metric('Expected pace','1,300','Based on workdays','warn')+metric('Attendance','91%','Recorded workdays','good')+'</div><div class="two-col">'+box('Workday heatmap','October 2026','<div class="heatmap">'+Array.from({length:35},(_,i)=>'<div class="heatcell '+(['','l1','l2','l3'][i%4])+'">'+(i<31?i+1:'')+'</div>').join('')+'</div>')+box('Monthly highlights','Team',list([['Best output day','182 completed designs','7 Oct'],['Most active day','82h 41m tracked','5 Oct'],['Pace gap','96 designs behind target',pill('Watch','amber')]]))+'</div></div>';}
function reports(){return head('Reporting','Reports','Reconcile production, hours and payroll from one report hub.','')+'<div class="stack"><div class="grid g3">'+box('Production report','Designs and skips','<p class="small">Daily and monthly output by designer, with skip reason breakdown.</p><button class="btn" data-action="export">Export report ↗</button>')+box('Time report','Hours and attendance','<p class="small">Tracked sessions, late days and workday summaries.</p><button class="btn" data-action="export">Export report ↗</button>')+box('Payroll report','Salary and deposits','<p class="small">Payable amounts, payment status and deposit ledger.</p><button class="btn" data-action="export">Export report ↗</button>')+'</div>'+filters('<label>Report<select class="field"><option>Production summary</option><option>Time summary</option><option>Payroll summary</option></select></label>')+rows(['Report preview','Last 7 days','Designer','Completed','Skipped','Hours','Note'],[['Designer A','161','14','42h 12m','On pace'],['Designer B','152','8','39h 20m','On pace'],['Designer C','126','11','37h 08m','Review skips']].map(x=>row([x[0],x[1],x[2],x[3],pill(x[4],x[4]==='On pace'?'green':'amber')])).join(''))+'</div>';}
function salary(){return head('Payroll control','Salary','Track each staff member’s payable salary and payment status.','<button class="btn" data-action="export">Export ledger</button>')+'<div class="stack">'+filters('<label>Salary month<input type="month" class="field" value="2026-09"></label>')+'<div class="grid g4">'+metric('Staff in period','11','Salary records')+metric('Net payable','৳ 2,68,000','Illustrative total','blue')+metric('Paid','7','Payment recorded','good')+metric('Unpaid / partial','4','Needs follow-up','warn')+'</div>'+rows(['Payment tracker','Scheduled payday: 5 Oct 2026','Staff','Net payable','Due','Status','Paid on','Action'],[['Designer A','৳ 28,000','Paid','5 Oct'],['Designer B','৳ 26,000','Paid','5 Oct'],['Designer C','৳ 25,000','Partial','6 Oct'],['Designer D','৳ 24,000','Not recorded','—']].map(x=>row([x[0],x[1],'5 Oct',pill(x[2],x[2]==='Paid'?'green':x[2]==='Partial'?'amber':'red'),x[3],'<button class="btn ghost" data-action="payment">Update</button>'])).join(''))+'<div class="note"><strong>Payment status is a record</strong><p>This prototype does not send money. The live system should show payment records only when an authorized person enters them.</p></div></div>';}
function deposits(){return head('Staff deposits','Deposits','See monthly security deposits, balances and final settlements.','')+'<div class="stack"><div class="grid g4">'+metric('Active contributors','11','Staff with deposit schedule')+metric('Recorded this month','৳ 5,500','Ledger entries','blue')+metric('Held balance','৳ 38,500','Illustrative total','good')+metric('Settlements open','1','Needs confirmation','warn')+'</div>'+filters('<label>Month<input type="month" class="field" value="2026-10"></label>')+rows(['Deposit ledger','Monthly entries and balances','Staff','Monthly entry','Total held','Status','Action'],[['Designer A','৳ 500','৳ 3,500','Recorded'],['Designer B','৳ 500','৳ 3,000','Recorded'],['Designer C','৳ 500','৳ 2,500','Recorded'],['Former staff','—','৳ 1,000','Settlement']].map(x=>row([x[0],x[1],x[2],pill(x[3],x[3]==='Settlement'?'amber':'green'),'<button class="btn ghost" data-action="deposit">View</button>'])).join(''))+'</div>';}
function alerts(){return head('Oversight','Alerts','Prioritized operational signals, with clear ownership and next action.','')+'<div class="stack"><div class="grid g4">'+metric('Open alerts','3','Actionable now','warn')+metric('Critical','1','Agent connection','danger-text')+metric('Acknowledged','2','Today','blue')+metric('Resolved','12','Last 7 days','good')+'</div>'+filters('<label>Severity<select class="field"><option>All severities</option><option>Critical</option><option>Warning</option></select></label>')+list([['Agent silent · Designer D','No heartbeat for more than 90 seconds',pill('Critical','red')],['Unusual skip rate · Designer C','Review recent reasons before deciding',pill('Warning','amber')],['Replacement owed · 1 design','Pool sweep may resolve the debt',pill('Warning','amber')]])+'</div>';}
function security(){return head('System oversight','Security','Monitor access, registered devices and security events.','')+'<div class="stack"><div class="grid g4">'+metric('Active devices','11','Registered agents','good')+metric('Revoked devices','2','Historical records','blue')+metric('Sign-in failures','1','Last 24 hours','warn')+metric('Open security alerts','0','No current escalation','good')+'</div><div class="two-col">'+rows(['Registered devices','Newest heartbeat','Device','Assigned staff','Last seen','State'],[['DESK-01','Designer A','09:52','Active'],['DESK-02','Designer B','09:50','Active'],['DESK-04','Designer D','08:12','Offline']].map(x=>row([x[0],x[1],x[2],pill(x[3],x[3]==='Active'?'green':'red')])).join(''))+box('Recent access events','Read-only preview','<div class="timeline">'+[['09:51','Owner signed in','Portal session'],['08:28','Agent enrollment check','Device DESK-02'],['Yesterday','Old device revoked','Prior device registration']].map(x=>'<div class="event"><span class="event-time">'+x[0]+'</span><i class="event-dot"></i><div><strong>'+x[1]+'</strong><p>'+x[2]+'</p></div></div>').join('')+'</div>')+'</div></div>';}
function settings(){return head('Configuration','Settings','Keep policies, accounts and notification rules easy to find.','')+'<div class="stack"><div class="grid g3">'+box('Targets & distribution','Designer workflow',list([['Morning distribution','Runs at 08:00 Asia/Dhaka',pill('On','green')],['1:1 replacement','After each recorded skip',pill('On','green')],['Random allocation','Eligible designers',pill('On','green')]])) +box('Agent & tracking','Office PCs',list([['Screenshot interval','Policy controlled',pill('Active','blue')],['Idle threshold','Managed centrally',pill('Active','blue')],['Agent updates','Staged rollout',pill('Managed','gray')]]))+box('People & access','Roles and permissions',list([['Owner access','Full management',pill('1 account','blue')],['Manager access','Operational control',pill('2 accounts','blue')],['Designer access','Own work only',pill('8 accounts','gray')]]))+'</div>'+box('Notifications','Choose what appears in the workspace','<div class="check-row"><div><b>Critical agent alerts</b><small>Show connection failures in Alerts and Inbox</small></div><span class="switch on"></span></div><div class="check-row"><div><b>Pending skip reviews</b><small>Notify managers when a decision is waiting</small></div><span class="switch on"></span></div><div class="check-row"><div><b>Daily digest</b><small>Summarize output and outstanding work</small></div><span class="switch"></span></div>')+'</div>';}
function office(){return head('Operations hub','Office','Requests, attendance, equipment and policies in one staff-friendly workspace.','<button class="btn primary" data-action="new-request">+ New request</button>')+'<div class="stack"><div class="grid g4">'+metric('Open help requests','2','Waiting for response','warn')+metric('Leave requests','1','Manager review','blue')+metric('Equipment cases','3','Tracked items','good')+metric('Policy acknowledgements','10 / 11','One pending','warn')+'</div><div class="grid g3">'+box('Help desk','Staff requests',list([['Designer A · Software access','Submitted 09:14',pill('New','blue')],['Designer C · Device issue','Submitted yesterday',pill('In progress','amber')]]))+box('Leave & attendance','Upcoming',list([['Designer B','Leave request for 12 Oct',pill('Review','amber')],['Team holiday','Next scheduled office closure',pill('Calendar','blue')]]))+box('Equipment','Assigned items',list([['DESK-01','Designer A · active',pill('Good','green')],['Tablet-04','Designer C · repair requested',pill('Check','amber')]]))+'</div>'+rows(['Office activity','Recent updates','Area','Item','Owner','Status'],[['Help request','Software access','Designer A','New'],['Equipment','Tablet repair','Designer C','In progress'],['Policy','Security acknowledgement','Designer D','Pending']].map(x=>row([x[0],x[1],x[2],pill(x[3],x[3]==='Pending'?'amber':'blue')])).join(''))+'</div>';}
function production(){return head('Production control','Production','Watch workload, quality and deadlines from one operational board.','<button class="btn" data-action="export">Export board</button>')+'<div class="stack"><div class="grid g4">'+metric('In production','128','Active design jobs','blue')+metric('Submitted today','176','Completed designs','good')+metric('Quality review','14','Waiting checks','warn')+metric('At risk','3','Deadline or blocker','danger-text')+'</div><div class="panel panel-pad"><div class="section-head"><h2>Production flow</h2><span>Sample cards, grouped by stage</span></div><div class="kanban">'+[['Ready','B0D3E5A901','B0A9N2Q443'],['Designing','Job #3488 · Designer A','Job #3494 · Designer C'],['Quality review','Job #3472 · Designer B','Job #3475 · Designer D'],['Done','Job #3461','Job #3462']].map((lane,i)=>'<div class="lane"><div class="lane-head">'+lane[0]+' '+pill(String(i===0?42:i===1?128:i===2?14:176),i===3?'green':'blue')+'</div>'+lane.slice(1).map(c=>'<div class="lane-card"><b>'+c+'</b><small>'+['Ready for assignment','In active work','Awaiting check','Completed'][i]+'</small></div>').join('')+'</div>').join('')+'</div></div><div class="two-col">'+box('Workload watch','Across designers',list([['Designer A','23 open · 1 due soon',pill('Balanced','green')],['Designer B','27 open · 2 due soon',pill('Busy','amber')],['Designer C','30 open · 1 blocked',pill('At cap','red')]]))+box('Quality signals','Recent 7 days',list([['First-pass acceptance','92% of reviewed jobs',pill('Healthy','green')],['Copyright skips','4 recorded',pill('Review','amber')],['Rework requests','6 open',pill('Track','blue')]]))+'</div></div>';}
const pages={live,worklog,add,pool,daily,review,mydata,staff:staffView,screenshots,monthly,reports,salary,deposits,alerts,security,settings,office,production};
function render(){nav();$('#page').innerHTML=pages[active]();$('#sidebar').classList.remove('open');window.scrollTo(0,0);history.replaceState(null,'','#'+active);}
function go(page){if(!rolePages[role].includes(page))return;active=page;sectionTab='overview';render();}
function toast(message){const t=document.createElement('div');t.className='toast';t.textContent=message;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function modal(title,body){$('#modal-root').innerHTML='<div class="modal-backdrop"><div class="panel modal" role="dialog" aria-modal="true"><h2>'+title+'</h2><p>'+body+'</p><div class="modal-actions"><button class="btn" data-action="close-modal">Close</button></div></div></div>';}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){go(p.dataset.page);return}const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action;if(action==='close-modal'){$('#modal-root').innerHTML='';return}if(action==='search'){modal('Search workspace','The production redesign can search people, targets, jobs and pages from one place.');return}if(action==='inbox'){modal('Inbox','3 sample items: agent connection, skip review and office request.');return}if(action==='reasons'){modal('Skip reason breakdown','Page Not Found 2 · Event 1 · Copyright 1 · Others 0. This is sample data.');return}if(action==='select-design'){document.querySelectorAll('.selected-design').forEach(row=>row.classList.remove('selected-design'));a.closest('tr').classList.add('selected-design');toast('Design selected in this preview');return}if(['review-item','profile','details','payment','deposit','new-staff','new-request'].includes(action)){modal('Preview action','This control demonstrates the intended flow. It does not change live data.');return}toast('Mockup preview — no live data or external action');});
$('#role').addEventListener('change',e=>{role=e.target.value;if(!rolePages[role].includes(active))active=role==='designer'?'mydata':role==='researcher'?'add':'live';render();});
$('#menu').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
window.addEventListener('hashchange',()=>{const page=location.hash.slice(1);if(rolePages[role].includes(page)){active=page;render();}});
const initial=location.hash.slice(1);if(rolePages[role].includes(initial))active=initial;render();
</script>
